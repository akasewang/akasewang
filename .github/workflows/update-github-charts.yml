name: Update GitHub charts

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-github-charts.yml'
      - 'scripts/github/**'

permissions:
  contents: read

concurrency:
  group: github-profile-charts
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Test chart generation
        run: node --test scripts/github/charts.test.mjs

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github/generate.mjs

      - name: Validate SVG documents
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('assets/github').glob('*.svg'):
              assert ET.parse(path).getroot().tag == '{http://www.w3.org/2000/svg}svg', path
          PY

      - name: Commit changed SVGs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/github/github-stats.svg assets/github/top-languages.svg assets/github/activity-graph.svg
          if git diff --cached --quiet; then
            echo "Charts are unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update GitHub charts'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
